<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Housebets Sportsbook Prototype</title>
<style>
:root{--bg:#07131a;--s1:#0e202b;--s2:#14303d;--s3:#1a3a49;--ln:#1d3a49;--t:#e9f5f6;--m:#8aa6ad;--ac:#c4f3ef;--od:#35c6f0;--live:#e8245f;--gold:#f4c542;--ok:#2fd18b;--bad:#ff6a6a;--warn:#ffb04a;color-scheme:dark}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--t);font:14px/1.35 "Segoe UI",Roboto,system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}input{font:inherit}
header{position:sticky;top:0;z-index:20;background:#0b1a21;border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:10px;padding:10px 14px}
.logo{flex:1;line-height:0}.logo img{height:34px;width:auto;display:block}
.bal{background:var(--s1);border:1px solid var(--ln);padding:7px 11px;border-radius:10px;font-weight:700;font-size:13px}.bal small{color:var(--m);font-weight:600}
#nav,#side{display:none}main{padding:12px 14px 180px;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.chip{flex:none;background:var(--s1);border:1px solid var(--ln);padding:8px 13px;border-radius:12px;font-size:13px;white-space:nowrap}.chip.on{background:var(--s3);color:var(--ac);border-color:#2c6678}
.srch{display:flex;gap:8px;align-items:center;background:var(--s1);border:1px solid #24596a;border-radius:12px;padding:0 12px;margin-bottom:10px}.srch input{flex:1;background:none;border:0;outline:0;color:var(--t);padding:12px 0}
h1{font-size:20px;margin:4px 0 10px}h2{font-size:16px;margin:16px 0 8px;display:flex;justify-content:space-between;align-items:center}h2 small{color:var(--m);font-weight:500;font-size:12px;cursor:pointer}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:14px;padding:12px}.emp{color:var(--m);text-align:center;padding:22px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}.hs{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}.hs>.card{flex:none;width:300px}
.mh{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--m);margin-bottom:8px}.mh .sp{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lv{background:var(--live);color:#fff;font-weight:800;font-size:11px;padding:2px 7px;border-radius:6px}.mh b{color:var(--t)}
.star{font-size:17px;color:var(--m)}.star.on{color:var(--gold)}.go{color:var(--od)}
.tm{display:flex;align-items:center;gap:9px;padding:3px 0;font-weight:600;cursor:pointer}.tm .sc{margin-left:auto;font-weight:800}
.bd{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:8px;font-weight:800;color:#fff;flex:none}
.og{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}.og.t2{grid-template-columns:1fr 1fr}
.o{background:var(--s2);border-radius:9px;padding:8px 9px;text-align:left;min-width:0}.o small{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.o b{color:var(--od);font-size:14px}
.o.up b{color:var(--ok)}.o.dn b{color:var(--bad)}.o.sel{background:#0f7d9e}.o.sel b{color:#fff}.o.lk{opacity:.5;pointer-events:none}
.susp{margin-top:9px;border:1px dashed #6b5524;color:var(--warn);border-radius:9px;padding:10px;text-align:center;font-weight:700}
.lg{display:flex;justify-content:space-between;align-items:center;background:var(--s1);border:1px solid var(--ln);border-radius:12px;padding:13px;margin-bottom:8px;cursor:pointer}.lg span{color:var(--m)}
.sb{text-align:center;background:linear-gradient(160deg,#10303d,#0b1d27)}.sb .r{display:flex;align-items:center;justify-content:space-around;gap:6px;margin:10px 0}.sb .r>div{flex:1;font-weight:700}.sb .bd{width:42px;height:42px;font-size:12px;margin:0 auto 6px}
.nm{display:inline-grid;place-items:center;width:40px;height:46px;background:var(--bg);border-radius:9px;font-size:24px;font-weight:800;margin:0 3px}
.fl{font-size:12px;border:1px solid #6b5a22;color:var(--gold);border-radius:12px;padding:3px 9px;margin-top:6px}.fl.off{border-color:var(--ln);color:var(--m)}
details.card{margin-bottom:10px;padding:0}summary{padding:13px 12px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between}details .og{padding:0 12px 12px;margin:0}
.back{background:var(--s1);border:1px solid var(--ln);border-radius:10px;padding:8px 14px;margin-bottom:10px;font-size:16px}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs .chip{flex:1;text-align:center}
.msg{border-radius:9px;padding:10px;margin-top:10px;font-size:13px}.msg.w{background:#2e2511;color:var(--warn)}.msg.b{background:#32161a;color:var(--bad)}.msg.g{background:#0e2f25;color:var(--ok)}
.btn{display:block;width:100%;background:var(--ac);color:#06242a;font-weight:800;padding:13px;border-radius:12px;margin-top:10px;font-size:15px}.btn:disabled{opacity:.35}.btn.l{background:var(--s3);color:var(--t)}
.stk{width:100%;background:var(--s2);border:1px solid #2b5565;border-radius:10px;color:var(--t);font-size:20px;font-weight:700;padding:10px;margin:6px 0}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.qa button{background:var(--s2);border-radius:8px;padding:8px;font-weight:700}
.ln{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--ln)}.ret{color:var(--gold);font-weight:800}
.sel2{display:flex;justify-content:space-between;align-items:start;margin-bottom:8px}.sel2 small{color:var(--m);display:block}
.demo{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:12px;font-size:11px;color:var(--m)}.demo button{background:var(--s2);padding:6px 9px;border-radius:8px;font-size:11px}.demo .on{background:var(--live)}
.won{color:var(--ok);font-weight:800}.lost{color:var(--bad);font-weight:800}
#bar{position:fixed;left:12px;right:12px;bottom:calc(120px + env(safe-area-inset-bottom,0px));z-index:30;display:none;background:var(--ac);color:#06242a;border-radius:13px;padding:13px;font-weight:800;justify-content:space-between;box-shadow:0 6px 20px #000a}
#bar i{background:#06242a;color:var(--ac);border-radius:6px;padding:0 7px;margin-right:8px;font-style:normal}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--s3);padding:10px 16px;border-radius:10px;display:none;z-index:50}
@media(min-width:900px){#app{display:grid;grid-template-columns:210px minmax(0,1fr) 360px;align-items:start}#nav,#side{display:block;position:sticky;top:60px;padding:14px;max-height:calc(100vh - 60px);overflow:auto}#side{border-left:1px solid var(--ln)}#nav{border-right:1px solid var(--ln)}
#bar,#bn{display:none!important}main{padding:18px 22px 40px}.nv{display:block;width:100%;text-align:left;padding:11px 12px;border-radius:10px;color:var(--m);margin-bottom:4px}.nv.on{background:var(--s3);color:var(--ac)}}
.ibs{display:flex;justify-content:space-between;gap:4px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}.ib{flex:1;min-width:62px;text-align:center;font-size:12px;padding:6px 4px;border-radius:10px}.ib i{display:block;font-style:normal;font-size:22px;margin-bottom:3px}.ib.on{color:var(--ac)}.ib sup{color:var(--live);font-weight:800}.qts{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}.qt{flex:none;width:148px;background:var(--s1);border:1px solid var(--ln);border-top:3px solid var(--ac);border-radius:8px;padding:12px 11px;text-align:left;font-weight:800;font-size:13px}.qt.on{background:var(--s3);color:var(--ac)}#bn{position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;height:58px;display:flex;align-items:center;padding:0 6px;background:linear-gradient(180deg,#171c25,#0e1219);border:1px solid rgba(255,255,255,.14);border-radius:30px;box-shadow:0 8px 24px #000c,inset 0 1px 0 rgba(255,255,255,.06)}
#bn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#bn .nb{flex:1;height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:#aab1bb;font-size:11px;border-radius:15px;position:relative;padding-bottom:6px;border:1px solid transparent}
#bn .nb:after{content:"";position:absolute;bottom:3px;width:16px;height:2.5px;border-radius:2px;background:#3b414b}
#bn .nb.on{background:linear-gradient(180deg,#1b212b,#12171e);border-color:rgba(255,255,255,.1);color:#fff}#bn .nb.on:after{background:#c4f3ef}
#bn .lv2 svg{stroke:#ff4d3f}#bn .lv2 circle{fill:#ff4d3f;stroke:none}#bn .lv2.on:after{background:#ff4d3f}
#bn .bc{flex:0 0 92px;height:58px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;color:#fff;font-weight:800;font-size:12px;padding-bottom:6px}
#bn .bc:before{content:"";position:absolute;left:50%;transform:translateX(-50%);top:-30px;width:96px;height:94px;border-radius:48px 48px 26px 26px;background:linear-gradient(180deg,#171c25,#0e1219);border:1px solid rgba(255,255,255,.14);z-index:-1}
#bn .bc:after{content:"";position:absolute;bottom:-3px;width:22px;height:2.5px;border-radius:2px;background:#e9e9e9}
#bn .cb{position:absolute;top:-23px;left:50%;margin-left:-29px;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#1d232c,#0d1117);border:2px solid #e8dccb;box-shadow:0 0 14px rgba(232,220,203,.35),inset 0 0 10px rgba(255,255,255,.08)}
#bn .cb svg{width:30px;height:30px;stroke:#e4e8ee;stroke-width:1.5}
#bn .cb sup{position:absolute;top:-5px;right:-11px;width:23px;height:23px;border-radius:50%;background:#10151c;border:2px solid #d9dde3;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff}
#mn{display:none}#mn .sh{position:fixed;inset:0;background:#0008;z-index:40}#mn .mnb{position:fixed;left:12px;right:12px;bottom:118px;background:var(--s1);border:1px solid var(--ln);border-radius:14px;z-index:41;padding:6px}#mn button{display:block;width:100%;text-align:left;padding:14px;font-size:15px;border-top:1px solid var(--ln)}#mn button:first-child{border:0}@media(min-width:900px){#mn{display:none!important}}</style></head><body>
